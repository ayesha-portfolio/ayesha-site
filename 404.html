
<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Redirecting...</title>
    <script>
      var repo = "/ayesha-site";
      var path = window.location.pathname.replace(repo, "");
      window.location.replace(
        repo + "/?redirect=" + encodeURIComponent(path)
      );
    </script>
  </head>
  <body></body>
</html>
